.addon-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:6px 0 12px}

.pg-tbl td:first-child,.pg-tbl th:first-child{width:2.2em;color:var(--faint)}
.pg-code{white-space:nowrap;font-weight:600}
.pg-link{color:var(--accent);font-size:13px;overflow-wrap:anywhere;word-break:break-all}
.fhint a,.callout a{color:var(--accent);text-underline-offset:2px}
.pg-note{color:var(--orange);font-size:13px}
.pg-strike{color:var(--faint);font-size:13px;text-decoration:line-through}
.nowrap{white-space:nowrap}
.card ol ul{margin:6px 0 0;padding-left:20px;list-style:disc}
